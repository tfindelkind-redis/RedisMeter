[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redismeter"
version = "1.0.0"
description = "Python SDK for the RedisMeter benchmarking tool"
readme = "README.md"
license = "MIT"
authors = [
    { name = "RedisMeter Team", email = "redismeter@example.com" }
]
keywords = ["redis", "benchmark", "performance", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# HTTP client options
httpx = ["httpx>=0.25.0"]
requests = ["requests>=2.31.0"]

# For async support
async = ["httpx>=0.25.0"]

# All optional dependencies
all = [
    "httpx>=0.25.0",
    "requests>=2.31.0",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "respx>=0.20.0",  # For mocking httpx
    "responses>=0.23.0",  # For mocking requests
]

[project.urls]
Homepage = "https://github.com/redismeter/redismeter"
Documentation = "https://redismeter.readthedocs.io"
Repository = "https://github.com/redismeter/redismeter"
Issues = "https://github.com/redismeter/redismeter/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/redismeter",
]

[tool.hatch.build.targets.wheel]
packages = ["redismeter"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["redismeter"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["redismeter"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
